<!DOCTYPE html>

<head><title>example - Oxford Advanced Learner's Dictionary</title></head>
<body>
<!-- Shaped like a real entry page, so the real parser reads it: h1, .webtop .pos,
     .phons_n_am .phon, li.sense .def and ul.examples li -->
<div class="entry" id="example_1">
  <div class="top-container">
    <div class="webtop">
      <h1 class="headword">example</h1>
      <span class="pos">noun</span>
      <div class="phonetics">
        <div class="phons_n_am">
          <span class="phon">/ɪɡˈzæmpl/</span>
        </div>
      </div>
    </div>
  </div>
  <ol class="senses_multiple">
    <li class="sense">
      <span class="def">something such as an object, a fact or a situation that shows, explains or supports what you say</span>
      <ul class="examples">
        <li><span class="x">Can you give me an example of what you mean?</span></li>
        <li><span class="x">This is a good example of the artist's early work.</span></li>
      </ul>
    </li>
  </ol>
</div>
